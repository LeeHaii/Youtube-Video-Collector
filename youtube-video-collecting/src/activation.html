<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>YouTube Ultimate Tool - License Activation</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .activation-container {
        width: 100%;
        max-width: 420px;
        background-color: #ffffff;
        border-radius: 12px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        padding: 40px 30px;
        text-align: center;
      }

      .logo {
        font-size: 32px;
        margin-bottom: 20px;
      }

      h1 {
        font-size: 28px;
        color: #2d3748;
        margin-bottom: 12px;
        font-weight: 700;
      }

      .subtitle {
        font-size: 14px;
        color: #718096;
        margin-bottom: 30px;
        line-height: 1.5;
      }

      .form-section {
        margin-bottom: 24px;
        text-align: left;
      }

      .form-label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: #4a5568;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 8px;
      }

      #licenseKeyInput {
        width: 100%;
        padding: 12px 14px;
        font-size: 14px;
        border: 2px solid #cbd5e0;
        border-radius: 6px;
        background-color: #f7fafc;
        color: #2d3748;
        font-family: 'Monaco', 'Menlo', 'Courier New', monospace;
        transition: all 0.2s;
      }

      #licenseKeyInput:focus {
        outline: none;
        border-color: #667eea;
        background-color: #fff;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }

      .button-group {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }

      .btn-activate {
        flex: 1;
        padding: 12px 16px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        cursor: pointer;
        transition: all 0.2s;
      }

      .btn-activate:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
      }

      .btn-activate:active:not(:disabled) {
        transform: translateY(0);
      }

      .btn-activate:disabled {
        background: linear-gradient(135deg, #cbd5e0 0%, #a0aec0 100%);
        cursor: not-allowed;
      }

      .btn-quit {
        flex: 1;
        padding: 12px 16px;
        background-color: #edf2f7;
        color: #4a5568;
        border: 2px solid #cbd5e0;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        cursor: pointer;
        transition: all 0.2s;
      }

      .btn-quit:hover {
        background-color: #e2e8f0;
        border-color: #a0aec0;
      }

      .message {
        padding: 12px 14px;
        border-radius: 6px;
        font-size: 13px;
        margin-bottom: 20px;
        display: none;
        text-align: left;
      }

      .message.error {
        background-color: #fed7d7;
        color: #c53030;
        border-left: 4px solid #c53030;
        display: block;
      }

      .message.success {
        background-color: #c6f6d5;
        color: #22543d;
        border-left: 4px solid #22543d;
        display: block;
      }

      .message.loading {
        background-color: #bee3f8;
        color: #2c5282;
        border-left: 4px solid #2c5282;
        display: block;
      }

      .spinner {
        display: inline-block;
        width: 14px;
        height: 14px;
        border: 2px solid #bee3f8;
        border-top-color: #2c5282;
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
        margin-right: 8px;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .info-text {
        font-size: 12px;
        color: #718096;
        margin-top: 20px;
        line-height: 1.6;
        border-top: 1px solid #e2e8f0;
        padding-top: 20px;
      }

      .info-text strong {
        color: #4a5568;
      }
    </style>
  </head>
  <body>
    <div class="activation-container">
      <div class="logo">🔑</div>
      <h1>License Activation</h1>
      <p class="subtitle">Enter your license key to activate YouTube Ultimate Tool</p>

      <div class="message" id="message"></div>

      <div class="form-section">
        <label class="form-label" for="licenseKeyInput">License Key:</label>
        <input
          type="text"
          id="licenseKeyInput"
          placeholder="Enter your license key here..."
          autofocus
        />
      </div>

      <div class="button-group">
        <button id="activateBtn" class="btn-activate">Activate</button>
        <button id="quitBtn" class="btn-quit">Quit</button>
      </div>

      <div class="info-text">
        <strong>Don't have a license key?</strong><br />
        Contact us for a license: <a href="https://www.facebook.com/rhymx2k3/" target="_blank">Facebook</a>
      </div>
    </div>

    <script src="activation.js"></script>
  </body>
</html>
